name: Cezar conflict-of-interest negative test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-provider-must-not-count-as-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CEZ_DRY_RUN: "1"
      CEZ_MOCK_PACE: "0"
      CEZ_DISPATCH: "0"
      CEZ_TELEMETRY: "0"
      CI: "true"
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - name: Create synthetic same-runner violation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/fixture/.ai/cezar/workflows"
          cd "$RUNNER_TEMP/pkg"
          timeout 80s npm install --no-save --no-audit --no-fund --ignore-scripts cezar-run@0.20.0
          cd "$RUNNER_TEMP/fixture"
          printf 'Synthetic fixture no VeresiEB content\n' > README.md
          cat > .ai/cezar/workflows/same-runner.yaml <<'YAML'
          version: 2
          name: same-runner
          nodes:
            - { id: start, type: start }
            - { id: implement, type: agent, runner: claude, prompt: "{{task}} mock:done" }
            - { id: reviewer, type: agent, runner: claude, prompt: "Independently approve this task mock:verdict=approve", verdicts: [approve, changes] }
            - { id: approved, type: end, status: success }
            - { id: blocked, type: end, status: failed }
          edges:
            - { from: start, to: implement }
            - { from: implement.done, to: reviewer }
            - { from: reviewer.approve, to: approved }
            - { from: reviewer.changes, to: blocked }
          YAML
          git init -q
          git config user.name "Synthetic"
          git config user.email "synthetic@example.invalid"
          git add README.md .ai
          git commit -qm "synthetic negative test"
      - name: Negative assertion same runner is accepted, so no enforced independence
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP/fixture"
          timeout --signal=TERM --kill-after=5s 65s "$RUNNER_TEMP/pkg/node_modules/.bin/cezar-run" run --workflow same-runner "same AI backend for author and reviewer mock:done" > "$RUNNER_TEMP/negative.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/negative.log"
          echo "CEZAR_EXIT=$rc"
          test "$rc" -eq 0 || exit 1
          grep -q "verdict: approve" "$RUNNER_TEMP/negative.log" || exit 1
          grep -q "run done" "$RUNNER_TEMP/negative.log" || exit 1
          echo "NEGATIVE_POLICY_TEST=CONFIRMED_SAME_BACKEND_ALLOWED"
          echo "Note: this is evidence that separate identity enforcement is ABSENT, not a policy PASS"
